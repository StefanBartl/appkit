name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No Neovim is needed: the binary fake-engine of appkit-testkit stands in for an engine.
      - run: cargo test --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-deny
      # Known advisories, licenses, sources, and no app's crate in the tree of the kit.
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (see tools/check-lock-age.py).
      - run: python3 tools/check-lock-age.py --min-days 7

  # The tools test themselves; no control character in a tracked file, no colour in the CSS of the kit outside its tokens.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python3 -m unittest discover tools
      - run: python3 tools/check-control-chars.py
      - run: python3 tools/check-color-literals.py --root ui-kit/src --tokens ui-kit/src/tokens.css

  # The release kit (release-kit): stamping, install.sh with dash and Git Bash, install.ps1 with pwsh and
  # Windows PowerShell 5.1 against fake builds, publish.sh against a fake gh.
  release-kit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; else py=python3; fi
          "$py" -m unittest discover -s release-kit -p "test_*.py" -v
      # The scripts every release of every app carries: no finding of shellcheck (any level) and of
      # PSScriptAnalyzer (errors, warnings and information).
      - name: shellcheck on the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck release-kit/scripts/install.sh release-kit/publish.sh
      - name: PSScriptAnalyzer on install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path release-kit/scripts/install.ps1 -Severity Error, Warning, Information
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }

  # The browser parts of the kit (ui-kit): source only, checked and tested here; the apps bundle it.
  ui-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-kit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The lockfile is the truth; the age and trust policy are in ui-kit/pnpm-workspace.yaml.
      - run: npm install --global pnpm@11.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --audit-level high
