# cargo-deny: what may enter the dependency tree. Taken from tasks-desktop, where the kit was made.
# Run: cargo deny check

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates are errors.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    # notify (the file watcher) is CC0-1.0, a public domain dedication, and
    # its Linux backend inotify is ISC, a permissive license like MIT.
    "CC0-1.0",
    "ISC",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# The kit knows no app: an app's crate in its tree would be a cycle (the app depends on the kit).
deny = [
    { name = "tasks-hub" },
    { name = "hub-testkit" },
    { name = "rules-hub" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
