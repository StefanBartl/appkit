# release-kit/prepare: is this commit worth a rolling build?
#
# Only the tip of the default branch is built: a CI run of an older commit (finished late, or run
# again by hand) does not move `latest` backwards. When it is the tip and the pre-release `latest`
# does not exist yet, it is made once (at this commit, marked "starting"); its files and, last, its
# words are changed by release-kit/publish.
#
# Used in the job that decides, with `contents: write` and the commit of the CI run:
#
#   - id: prepare
#     uses: WKDSteve/appkit/release-kit/prepare@<sha> # vX.Y.Z
#     with:
#       sha: ${{ github.event.workflow_run.head_sha }}
#       token: ${{ github.token }}
#
# The job hands `steps.prepare.outputs.current` (and `sha`, `short`) on to the build jobs.
#
# Linux, macOS, hosted Windows and a self-hosted Windows runner: the work is release-kit/prepare.sh, run by `bash`
# where `bash` is bash and by Git Bash (full path, 8.3 form) on Windows, where `bash` of a self-hosted runner is the
# WSL launcher. The step is written twice (one `if` each) for that reason; `steps.facts` is the Windows one there.

name: release-kit prepare
description: Decide whether a commit gets a rolling build, and make the pre-release `latest` once.

inputs:
  sha:
    description: The commit the CI run was about.
    required: true
  token:
    description: A token with contents write (github.token).
    required: true
  branch:
    description: The branch whose tip is built.
    required: false
    default: main

outputs:
  current:
    description: "'true' when the commit is the tip of the branch."
    value: ${{ steps.facts.outputs.current || steps.facts_windows.outputs.current }}
  sha:
    description: The commit.
    value: ${{ steps.facts.outputs.sha || steps.facts_windows.outputs.sha }}
  short:
    description: The first seven characters of the commit.
    value: ${{ steps.facts.outputs.short || steps.facts_windows.outputs.short }}

runs:
  using: composite
  steps:
    - name: Is this the tip of the branch, and does the pre-release exist
      id: facts
      if: runner.os != 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        KIT: ${{ github.action_path }}/..
      run: bash "$KIT/prepare.sh"
    - name: Is this the tip of the branch, and does the pre-release exist (Windows)
      id: facts_windows
      if: runner.os == 'Windows'
      shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        KIT: ${{ github.action_path }}/..
      run: bash "$(cygpath -u "$KIT")/prepare.sh"
